server:
  port: 9092            # HTTP : /actuator/health et /actuator/prometheus (le gRPC est sur grpc.port)

grpc:
  port: 9090

spring:
  application:
    name: grpc-telemetry
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/telemetry_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
