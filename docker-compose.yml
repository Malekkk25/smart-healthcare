services:
  postgres:
    image: postgres:16
    container_name: smart-healthcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- Partie 1 (personne A)

  soap-ehr:
    build:
      context: .
      dockerfile: services/soap-ehr/Dockerfile
    container_name: smart-healthcare-soap-ehr
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ehr_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  rest-portal:
    build:
      context: .
      dockerfile: services/rest-portal/Dockerfile
    container_name: smart-healthcare-rest-portal
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/portal_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      VISIO_SALT: ${VISIO_SALT:-smart-healthcare-dev}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: smart-healthcare-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?DEMO_PASSWORD manquant dans .env}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - soap-ehr
      - rest-portal

  web-client:
    build:
      context: ./web-client
      args:
        VITE_API_URL: http://localhost:8080
    container_name: smart-healthcare-web-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - gateway

  # ---------------------------------------------------------------- Partie 2 (personne B)
  # À ajouter par B : grpc-telemetry (9090), graphql-dashboard (8083), orchestrator (8085), ai-triage (8086).
  # Variables attendues par la gateway : DASHBOARD_URL, DASHBOARD_WS_URL, ORCHESTRATOR_URL
  # (par défaut http://graphql-dashboard:8083, ws://graphql-dashboard:8083, http://orchestrator:8085).
  #
  # En attendant les vrais services : stubs de A (tools/b-stubs), profil "stubs".
  #   docker compose --profile stubs up -d --build
  # Quand B ajoute ses vrais services, elle supprime les deux entrées ci-dessous (mêmes noms, mêmes ports).

  graphql-dashboard:
    profiles: ["stubs"]
    build:
      context: .
      dockerfile: tools/b-stubs/Dockerfile
    command: ["node", "server.js", "graphql"]
    container_name: smart-healthcare-graphql-stub
    restart: unless-stopped
    environment:
      REST_URL: http://rest-portal:8082
    ports:
      - "8083:8083"
    depends_on:
      - rest-portal

  orchestrator:
    profiles: ["stubs"]
    build:
      context: .
      dockerfile: tools/b-stubs/Dockerfile
    command: ["node", "server.js", "orchestrator"]
    container_name: smart-healthcare-orchestrator-stub
    restart: unless-stopped
    ports:
      - "8085:8085"

  # ---------------------------------------------------------------- Observabilité (profil "observability")
  #   docker compose --profile observability up -d   ->  Grafana : http://localhost:3001  (admin / GRAFANA_PASSWORD)

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    container_name: smart-healthcare-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"   # 9090 est réservé au gRPC de B

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    container_name: smart-healthcare-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
