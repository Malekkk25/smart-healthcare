services:
  postgres:
    image: postgres:16
    container_name: smart-healthcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- Partie 1 (personne A)

  soap-ehr:
    build:
      context: .
      dockerfile: services/soap-ehr/Dockerfile
    container_name: smart-healthcare-soap-ehr
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ehr_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EHR_SERVICE_PASSWORD: ${EHR_SERVICE_PASSWORD:?EHR_SERVICE_PASSWORD manquant dans .env}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  rest-portal:
    build:
      context: .
      dockerfile: services/rest-portal/Dockerfile
    container_name: smart-healthcare-rest-portal
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/portal_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      VISIO_SALT: ${VISIO_SALT:-smart-healthcare-dev}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: smart-healthcare-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?DEMO_PASSWORD manquant dans .env}
      EHR_SERVICE_PASSWORD: ${EHR_SERVICE_PASSWORD:?EHR_SERVICE_PASSWORD manquant dans .env}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - soap-ehr
      - rest-portal

  web-client:
    build:
      context: ./web-client
      args:
        VITE_API_URL: http://localhost:8080
    container_name: smart-healthcare-web-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - gateway

  # ---------------------------------------------------------------- Partie 2 (personne B)

  grpc-telemetry:
    build:
      context: .
      dockerfile: services/grpc-telemetry/Dockerfile
    container_name: smart-healthcare-grpc-telemetry
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/telemetry_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "9090:9090"
      - "127.0.0.1:9092:9092"   # actuator HTTP (santé, métriques), accessible seulement depuis cette machine
    depends_on:
      postgres:
        condition: service_healthy

  graphql-dashboard:
    build:
      context: .
      dockerfile: services/graphql-dashboard/Dockerfile
    container_name: smart-healthcare-graphql-dashboard
    restart: unless-stopped
    environment:
      REST_URL: http://rest-portal:8082
      TELEMETRY_TARGET: grpc-telemetry:9090
    ports:
      - "8083:8083"
    depends_on:
      - rest-portal
      - grpc-telemetry

  ai-triage:
    build:
      context: .
      dockerfile: services/ai-triage/Dockerfile
    container_name: smart-healthcare-ai-triage
    restart: unless-stopped
    environment:
      # Facultatif : sans clé, le résumé est généré par modèle de phrases (jamais d'erreur)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-5-5}
    ports:
      - "8086:8086"

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: smart-healthcare-orchestrator
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/workflow_db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      EHR_URL: http://soap-ehr:8081/ws/ehr
      EHR_SERVICE_PASSWORD: ${EHR_SERVICE_PASSWORD:?EHR_SERVICE_PASSWORD manquant dans .env}
      PORTAL_URL: http://rest-portal:8082
      DASHBOARD_URL: http://graphql-dashboard:8083/graphql
      TRIAGE_URL: http://ai-triage:8086
      TELEMETRY_TARGET: grpc-telemetry:9090
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      grpc-telemetry:
        condition: service_started

  # Simulateur de capteurs (profil "demo") : docker compose --profile demo up sensor-simulator
  # Le scénario se règle avec SCENARIO (voir tools/sensor-simulator/README.md)
  sensor-simulator:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: tools/sensor-simulator/Dockerfile
    container_name: smart-healthcare-sensor-simulator
    command: ["--host", "grpc-telemetry:9090", "--scenario", "${SCENARIO:-PAT-000004:crise_cardiaque}", "--speed", "${SPEED:-5}"]
    depends_on:
      - grpc-telemetry

  # ---------------------------------------------------------------- Observabilité (profil "observability")
  #   docker compose --profile observability up -d   ->  Grafana : http://localhost:3001  (admin / GRAFANA_PASSWORD)

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    container_name: smart-healthcare-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"   # 9090 est réservé au gRPC de B

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    container_name: smart-healthcare-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
