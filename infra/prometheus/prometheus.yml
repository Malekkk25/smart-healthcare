# Prometheus : lit les métriques Micrometer de chaque service (profil Docker "observability")
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: rest-portal
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["rest-portal:8082"]
  - job_name: soap-ehr
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["soap-ehr:8081"]
  - job_name: grpc-telemetry
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["grpc-telemetry:9092"]
  - job_name: graphql-dashboard
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["graphql-dashboard:8083"]
  - job_name: orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orchestrator:8085"]
  - job_name: ai-triage
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-triage:8086"]
